services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: car-manual-postgres
    environment:
      POSTGRES_DB: car_manual_ai
      POSTGRES_USER: car_manual
      POSTGRES_PASSWORD: car_manual_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  ai-service:
    build:
      context: ./ai-service
    container_name: car-manual-ai-service
    ports:
      - "8001:8001"
    volumes:
      - ./storage:/workspace/storage
      - ./ai-service/data:/app/data
    environment:
      STORAGE_ROOT: /workspace/storage
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_THINKING: ${LLM_THINKING:-disabled}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_EVIDENCE_JUDGE: ${LLM_EVIDENCE_JUDGE:-true}
      RAG_EMBEDDING_ENABLED: ${RAG_EMBEDDING_ENABLED:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}

  backend:
    build:
      context: ./backend
    container_name: car-manual-backend
    ports:
      - "5080:5080"
    volumes:
      - ./storage:/workspace/storage
    environment:
      ASPNETCORE_URLS: http://+:5080
      AiService__BaseUrl: http://ai-service:8001
      Storage__ManualRoot: /workspace/storage/manuals
      Database__Provider: Postgres
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=car_manual_ai;Username=car_manual;Password=car_manual_dev
      Admin__Username: admin
      Admin__Password: admin123
      Admin__Token: dev-admin-token
    depends_on:
      - postgres
      - ai-service

  frontend:
    build:
      context: ./frontend
    container_name: car-manual-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
