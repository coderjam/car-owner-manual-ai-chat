<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <rect width="1240" height="1754" fill="#ffffff"/>
  <rect x="72" y="72" width="1096" height="1610" fill="#ffffff" stroke="#d7dde5" stroke-width="4"/>
  <text x="100" y="145" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1d2733">2026 凯美瑞用户手册</text>
  <text x="100" y="205" font-family="Arial, sans-serif" font-size="24" fill="#5b6675">保养维护 · 手册第 316 页</text>
